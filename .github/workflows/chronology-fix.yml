name: One-shot editorial chronology migration

on:
  push:
    branches:
      - chore/editorial-publication-dates

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Redistribute publication dates
        shell: bash
        run: |
          set -euo pipefail

          move_post() {
            old="$1"
            new="$2"
            date="$3"

            test -f "$old"
            grep -q "^date: '2026-09-14'$" "$old"
            sed -i "s/^date: '2026-09-14'$/date: '${date}'/" "$old"
            git mv "$old" "$new"
          }

          move_post \
            _posts/2026-09-14-when_one_simulation_metric_tells_wrong_story.md \
            _posts/2026-09-01-when_one_simulation_metric_tells_wrong_story.md \
            2026-09-01

          move_post \
            _posts/2026-09-14-sampling_uncertainty_can_dominate_representation_uncertainty.md \
            _posts/2026-09-03-sampling_uncertainty_can_dominate_representation_uncertainty.md \
            2026-09-03

          move_post \
            _posts/2026-09-14-when_unlabelled_data_makes_semi_supervised_learning_worse.md \
            _posts/2026-09-05-when_unlabelled_data_makes_semi_supervised_learning_worse.md \
            2026-09-05

          move_post \
            _posts/2026-09-14-reproducible_randomness_is_more_than_calling_set_seed.md \
            _posts/2026-09-07-reproducible_randomness_is_more_than_calling_set_seed.md \
            2026-09-07

          move_post \
            _posts/2026-09-14-a_negative_monte_carlo_result_is_still_a_result.md \
            _posts/2026-09-09-a_negative_monte_carlo_result_is_still_a_result.md \
            2026-09-09

          move_post \
            _posts/2026-09-14-what_makes_statistical_software_trustworthy.md \
            _posts/2026-09-11-what_makes_statistical_software_trustworthy.md \
            2026-09-11

          move_post \
            _posts/2026-09-14-confidence_sets_are_not_just_intervals.md \
            _posts/2026-09-12-confidence_sets_are_not_just_intervals.md \
            2026-09-12

          rm .github/workflows/chronology-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix editorial publication chronology"
          git push origin HEAD:chore/editorial-publication-dates
