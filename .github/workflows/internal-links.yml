name: Internal link audit

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-links:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vendor/datalog/package-lock.json

      - name: Build theme JavaScript
        working-directory: vendor/datalog
        run: |
          npm ci --no-audit --no-fund
          npm run build:js

      - name: Copy theme assets
        run: python3 scripts/sync_theme_assets.py

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check internal links
        run: python3 scripts/check_internal_links.py _site
