name: Merge Schedule

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
  schedule:
    # https://crontab.guru/every-hour
    - cron: '55 2 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: 

jobs:
  merge_schedule:
    runs-on: ubuntu-24.04
    steps:
      # Upstream v2.7.0 still declares node20. Run the same bundled entry point
      # on Node 24 until upstream publishes an action with a supported runtime.
      - name: Checkout merge scheduler
        uses: actions/checkout@v7
        with:
          repository: gr2m/merge-schedule-action
          ref: a9b6ddcf1282dfd66907bda8e7941dff59f03bad # v2.7.0
          path: .github/action-sources/merge-schedule
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run merge scheduler
        run: node .github/action-sources/merge-schedule/dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MERGE_METHOD: merge
          INPUT_TIME_ZONE: Europe/London
          INPUT_REQUIRE_STATUSES_SUCCESS: 'true'
          INPUT_AUTOMERGE_FAIL_LABEL: merge-schedule-failed
