name: One-shot post organization migration

on:
  push:
    branches:
      - chore/organize-posts-by-subject-v2

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Record current Jekyll URLs
        shell: bash
        run: |
          bundle exec ruby <<'RUBY' > /tmp/legacy-post-urls.tsv
          require 'jekyll'
          require 'pathname'
          root = Pathname.new(Dir.pwd)
          config = Jekyll.configuration({
            'source' => Dir.pwd,
            'destination' => '/tmp/jekyll-before',
            'future' => true,
            'quiet' => true
          })
          site = Jekyll::Site.new(config)
          site.read
          site.posts.docs.each do |doc|
            path = Pathname.new(doc.path).relative_path_from(root).to_s
            puts [path, doc.url].join("\t")
          end
          RUBY

      - name: Move posts by primary category
        shell: python
        run: |
          from pathlib import Path
          import re
          import frontmatter

          root = Path('_posts')
          drafts = Path('_drafts')

          legacy_urls = {}
          for line in Path('/tmp/legacy-post-urls.tsv').read_text(encoding='utf-8').splitlines():
              path, url = line.split('\t', 1)
              legacy_urls[path] = url

          def category_slug(value: str) -> str:
              slug = re.sub(r'[^a-z0-9]+', '_', value.strip().lower()).strip('_')
              if not slug:
                  raise ValueError(f'Cannot derive folder slug from category {value!r}')
              return slug

          def add_permalink_without_reformatting(path: Path, url: str) -> None:
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  raise ValueError(f'Missing YAML front matter: {path}')
              head_end = text.find('\n---', 4)
              if head_end < 0:
                  raise ValueError(f'Unterminated YAML front matter: {path}')
              header = text[4:head_end]
              if re.search(r'^permalink\s*:', header, flags=re.MULTILINE):
                  return
              escaped = url.replace("'", "''")
              path.write_text("---\npermalink: '" + escaped + "'\n" + text[4:], encoding='utf-8')

          posts = sorted(root.rglob('*.md'))
          moves = []
          draft_moves = []
          destinations = set()

          for path in posts:
              old = path.as_posix()
              parts = set(path.parts)

              # These are planning-note repositories that were historically parked
              # under _posts. Their front matter is not evidence that they are articles.
              if '-_ideas' in parts or 'PHD_IDEAS' in parts:
                  target = drafts / ('ideas' if '-_ideas' in parts else 'phd') / path.name
                  if target in destinations:
                      raise ValueError(f'Destination collision: {target}')
                  destinations.add(target)
                  draft_moves.append((path, target))
                  continue

              post = frontmatter.load(path)
              categories = post.get('categories', [])
              if isinstance(categories, str):
                  categories = [categories]
              if not categories:
                  raise ValueError(f'Published post has no primary category: {path}')

              folder = category_slug(str(categories[0]))
              target = root / folder / path.name
              if target in destinations:
                  raise ValueError(f'Destination collision: {target}')
              destinations.add(target)

              if path == target:
                  continue

              if not post.get('permalink'):
                  try:
                      old_url = legacy_urls[old]
                  except KeyError as exc:
                      raise ValueError(f'No Jekyll URL found for {old}') from exc
                  add_permalink_without_reformatting(path, old_url)

              moves.append((path, target))

          manifest = []
          for source, target in moves:
              target.parent.mkdir(parents=True, exist_ok=True)
              source.rename(target)
              manifest.append((source.as_posix(), target.as_posix()))

          for source, target in draft_moves:
              target.parent.mkdir(parents=True, exist_ok=True)
              source.rename(target)

          for directory in sorted((p for p in root.rglob('*') if p.is_dir()), reverse=True):
              try:
                  directory.rmdir()
              except OSError:
                  pass

          Path('/tmp/post-move-manifest.tsv').write_text(
              ''.join(f'{old}\t{new}\n' for old, new in manifest),
              encoding='utf-8',
          )

          canonical = sorted(p.name for p in root.iterdir() if p.is_dir())
          flat = sorted(root.glob('*.md'))
          remaining = sorted(root.rglob('*.md'))

          print(f'MOVED_PUBLISHED_POSTS={len(moves)}')
          print(f'MOVED_DRAFT_NOTES={len(draft_moves)}')
          print(f'PUBLISHED_POSTS_AFTER={len(remaining)}')
          print(f'FLAT_POSTS_AFTER={len(flat)}')
          print('CANONICAL_FOLDERS=' + ','.join(canonical))

          if flat:
              raise SystemExit(f'Flat posts remain: {len(flat)}')
          if len(remaining) != 498:
              raise SystemExit(f'Expected 498 published articles, found {len(remaining)}')
          if len(draft_moves) != 25:
              raise SystemExit(f'Expected 25 idea/PhD notes, moved {len(draft_moves)}')

      - name: Verify every published URL is unchanged
        shell: bash
        run: |
          bundle exec ruby <<'RUBY' > /tmp/new-post-urls.tsv
          require 'jekyll'
          require 'pathname'
          root = Pathname.new(Dir.pwd)
          config = Jekyll.configuration({
            'source' => Dir.pwd,
            'destination' => '/tmp/jekyll-after',
            'future' => true,
            'quiet' => true
          })
          site = Jekyll::Site.new(config)
          site.read
          site.posts.docs.each do |doc|
            path = Pathname.new(doc.path).relative_path_from(root).to_s
            puts [path, doc.url].join("\t")
          end
          RUBY

          python <<'PY'
          from pathlib import Path

          def load(path):
              result = {}
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  key, value = line.split('\t', 1)
                  result[key] = value
              return result

          before = load('/tmp/legacy-post-urls.tsv')
          after = load('/tmp/new-post-urls.tsv')
          manifest = []
          for line in Path('/tmp/post-move-manifest.tsv').read_text(encoding='utf-8').splitlines():
              old, new = line.split('\t', 1)
              manifest.append((old, new))

          errors = []
          for old, new in manifest:
              if before.get(old) != after.get(new):
                  errors.append((old, before.get(old), new, after.get(new)))

          if len(after) != 498:
              errors.append(('post-count', 498, 'after', len(after)))

          if errors:
              for item in errors[:25]:
                  print('URL_MISMATCH', item)
              raise SystemExit(f'{len(errors)} URL/count mismatches')

          print(f'URL_PRESERVATION_OK={len(manifest)} moved posts checked')
          PY

      - name: Add organization documentation
        shell: bash
        run: |
          cat > docs/POST_ORGANIZATION.md <<'EOF'
          # Post organization

          Published articles live under `_posts/<primary-category>/`.

          The physical folder is derived from the first `categories` entry in a post's
          front matter using a lowercase underscore slug. Examples:

          - `Statistics` -> `_posts/statistics/`
          - `Data Science` -> `_posts/data_science/`
          - `Machine Learning` -> `_posts/machine_learning/`
          - `Time Series` -> `_posts/time_series/`
          - `Predictive Maintenance` -> `_posts/predictive_maintenance/`

          Folder placement is repository organization, not URL design. Existing URLs are
          preserved with explicit `permalink` values where a move would otherwise make the
          generated route depend on the directory hierarchy.

          Idea lists and PhD planning notes are not published posts. They live under
          `_drafts/ideas/` and `_drafts/phd/` instead of `_posts/`.

          When adding a new article:

          1. choose the primary category deliberately;
          2. place the file in the matching category folder;
          3. keep the standard `YYYY-MM-DD-title.md` filename;
          4. add a new category folder when the category is genuinely useful rather than
             forcing an article into an unrelated subject;
          5. preserve an established permalink when moving an existing article.

          Maintenance utilities that operate on `_posts` must recurse through subject
          folders.
          EOF

      - name: Verify Jekyll can build the reorganized repository
        run: bundle exec jekyll build --destination /tmp/site-organized
        env:
          JEKYLL_ENV: production

      - name: Remove one-shot workflow and commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/post-organization-migrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Organize posts by primary subject'
          git push origin HEAD:chore/organize-posts-by-subject-v2
