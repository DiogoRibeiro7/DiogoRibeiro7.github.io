name: Refresh licensed header images

on:
  push:
    branches:
      - assets/expand-header-image-library
    paths:
      - assets/viz/fetch_headers.py
      - .github/workflows/refresh-header-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: assets/expand-header-image-library
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --upgrade pillow

      - name: Fetch new Wikimedia Commons headers
        working-directory: assets/viz
        run: |
          python fetch_headers.py             research-             statistics-monte-carlo             statistics-survival-analysis             statistics-missing-data             statistics-propensity-score             time-series-             logistics-             industry-assembly-line

      - name: Commit fetched images and credits
        run: |
          if git diff --quiet -- assets/images/headers _data/image_credits.yml; then
            echo "No image changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/headers _data/image_credits.yml
          git commit -m "Add licensed topic-specific header images"
          git push
