name: Create issues from TODOs

on:
  workflow_dispatch:
    inputs:
      importAll:
        description: Import ALL TODOs from the checked-out ref (use with care)
        type: boolean
        required: false
        default: false
  push:
    # Use your default branch. Avoid multiple branches to prevent self-referencing on merges (per action docs).
    branches: [ master ]
    # Optional: run only when source files change, not docs/CI files.
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.py'
      - '**/*.rs'
      - '**/*.go'
      - '**/*.java'
      - '**/*.cs'
      - '**/*.rb'
      - '**/*.php'
      - '**/*.sh'
      - '!**/*.md'
      - '!.github/**'

permissions:
  contents: read
  issues: write
  repository-projects: read

concurrency:
  group: todo-issue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  todos:
    name: Convert TODOs to issues
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ !github.event.repository.fork }}  # don't run on forks

    steps:
      # Pin to a release or a commit SHA for supply-chain safety.
      # v5 example (or replace with a specific commit SHA):
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # If you plan to run "import all" against history, set fetch-depth: 0
          fetch-depth: 1

      - name: Who am I with this token?
        run: |
          set -euo pipefail
          who=$(curl -s -H "authorization: Bearer ${{ env.GITHUB_TOKEN }}" https://api.github.com/user | jq -r '.login,.type')
          echo "Actor via token: $who"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Upstream v2.0.0 wraps this .NET application with setup-dotnet@v4
      # (node20). Keep its source pinned and set up .NET with the current action.
      - name: Checkout TODO action source
        uses: actions/checkout@v7
        with:
          repository: juulsn/todo-issue
          ref: c27fbdb0a33572f73dbdb683aa8b1382bea8289e # v2.0.0
          path: .github/action-sources/todo-issue
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Run Issue Bot
        run: dotnet run --project .github/action-sources/todo-issue/src/TodoIssue.Action/TodoIssue.Action.csproj --configuration Release --no-launch-profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Preserve the inputs passed by upstream's composite action.
          INPUT_KEYWORDS: TODO
          INPUT_LABEL: todo
          INPUT_AUTOASSIGN: 'false'
          INPUT_CASESENSITIVE: 'false'
          # Keep the regex tight; add common big folders/build artifacts to skip.
          INPUT_EXCLUDEPATTERN: >-
            ^(
              node_modules/|
              dist/|
              build/|
              .next/|
              out/|
              coverage/|
              .venv/|
              venv/|
              target/|
              vendor/
            )

