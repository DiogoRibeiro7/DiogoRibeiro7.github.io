# =============================================================================
# DataLog theme, checked out as the vendor/datalog git submodule.
# Jekyll reads layouts, includes, plugins and Sass from there directly.
# Assets and theme data files cannot be redirected and are copied in by
# scripts/sync_theme_assets.py after each submodule update.
# =============================================================================
layouts_dir: vendor/datalog/_layouts
includes_dir: vendor/datalog/_includes
plugins_dir: vendor/datalog/_plugins
sass:
  sass_dir: vendor/datalog/_sass
  style: compressed

# =============================================================================
# Content
# =============================================================================
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
  smart_quotes: ["apos", "apos", "quot", "quot"]
  syntax_highlighter_opts:
    block:
      line_numbers: true
excerpt_separator: "\n\n"
permalink: /:categories/:title/
paginate: 10
paginate_path: "/blog/page:num/"
timezone: Europe/Lisbon

include:
  - _pages
exclude:
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - LICENSE
  - Rakefile
  - package.json
  - package-lock.json
  - requirements.txt
  - scripts
  - tests
  - test.js
  - "*.py"
  - __pycache__
  - frontmatter
  - front_matter_report.txt
  - files_with_multiple_categories.txt
  - staticman.yml
  - tmp
  - .bundle
  - .sass-cache
  - .jekyll-cache

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-redirect-from

# Archive anchor pages, the same keys Minimal Mistakes used. Post tags and
# categories link to /tags/#slug and /categories/#slug.
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      toc_label: On this page
      author: Diogo Ribeiro
      # The theme's default, TechnicalArticle, is not a schema.org type
      # (DiogoRibeiro7/analytics-blog-jekyll#302). This sets the JSON-LD; the
      # microdata itemtype is written by the theme's post layout.
      schema_type: TechArticle
  - scope:
      path: "_pages"
    values:
      layout: page
  - scope:
      path: ""
      type: "pages"
    values:
      show_author: false # pages are site chrome, not articles: no byline

# =============================================================================
# Theme features
# =============================================================================
notebooks:
  enabled: false
features:
  mathjax: true
  search: false
  dark_mode_toggle: true
  portfolio: false
  datasets: false
  visualizations: false
  academic_dashboard: false
  citation_tracking: false
critical_css:
  enabled: false
theme_options:
  math:
    engine: mathjax
    output: chtml
    accessibility: true
    render_on_load: auto
    mathjax_cdn: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
  localization:
    default_locale: en
    locales:
      - code: en
        label: English
        url: /
integrations:
  github:
    owner: DiogoRibeiro7
    api_base: https://api.github.com/repos
    cache_ttl: 43200
    enabled: false
  binder:
    enabled: false
  colab:
    enabled: false
datalog_plugins:
  enabled: []
  options: {}
seo:
  type: "Person"
  name: "Diogo Ribeiro"
  description: "Statistical ML, time series, causal inference, applied AI and open-source software."
social:
  github: DiogoRibeiro7
  linkedin: diogo-ribeiro-9094604a
  default_image: /assets/images/data-science.png
