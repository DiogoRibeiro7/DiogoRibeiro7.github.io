<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 520" role="img" aria-labelledby="title desc">
  <title id="title">A defensible LLM fine-tuning workflow</title>
  <desc id="desc">A workflow from deployment objective through data, split, chat formatting, LoRA or QLoRA training, validation, behavioral evaluation and deployment.</desc>
  <style>
    /* This diagram is embedded with an &lt;img&gt; tag, which makes the file an
       isolated document: currentColor cannot inherit the page's text colour and
       falls back to black, which disappears on the dark theme's near-black
       surface. Carry the surface and the ink the site's other figures use
       (assets/viz/house.mplstyle), so the diagram reads in either theme. */
    svg { color: #0b0b0b; }
    .diagram-surface { fill: #f7f9fa; }
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .flow { fill: none; stroke: currentColor; stroke-width: 2; }
    .label { fill: currentColor; text-anchor: middle;
             font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .step { font-size: 18px; font-weight: 600; }
    .gloss { font-size: 14px; }
    .note { font-size: 17px; font-weight: 600; }
  </style>
  <rect class="diagram-surface" x="0" y="0" width="100%" height="100%"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="currentColor"/>
    </marker>
  </defs>

  <g class="box">
    <rect x="30" y="80" width="200" height="100" rx="12"/>
    <rect x="265" y="80" width="200" height="100" rx="12"/>
    <rect x="500" y="80" width="200" height="100" rx="12"/>
    <rect x="735" y="80" width="200" height="100" rx="12"/>
    <rect x="970" y="80" width="200" height="100" rx="12"/>
    <rect x="1205" y="80" width="200" height="100" rx="12"/>
    <rect x="1440" y="80" width="150" height="100" rx="12"/>

    <rect x="255" y="300" width="220" height="100" rx="12"/>
    <rect x="725" y="300" width="220" height="100" rx="12"/>
    <rect x="1195" y="300" width="220" height="100" rx="12"/>
  </g>

  <g class="flow">
    <path d="M230 130 H259" marker-end="url(#arrow)"/>
    <path d="M465 130 H494" marker-end="url(#arrow)"/>
    <path d="M700 130 H729" marker-end="url(#arrow)"/>
    <path d="M935 130 H964" marker-end="url(#arrow)"/>
    <path d="M1170 130 H1199" marker-end="url(#arrow)"/>
    <path d="M1405 130 H1434" marker-end="url(#arrow)"/>
    <path d="M365 300 V182"/>
    <path d="M835 300 V182"/>
    <path d="M1305 300 V182"/>
  </g>

  <g class="label">
    <text class="step" x="130" y="116">Objective</text>
    <text class="gloss" x="130" y="142">behaviour</text>
    <text class="gloss" x="130" y="162">to change</text>

    <text class="step" x="365" y="116">Dataset</text>
    <text class="gloss" x="365" y="142">examples that</text>
    <text class="gloss" x="365" y="162">represent use</text>

    <text class="step" x="600" y="116">Split</text>
    <text class="gloss" x="600" y="142">no semantic</text>
    <text class="gloss" x="600" y="162">leakage</text>

    <text class="step" x="835" y="116">Formatting</text>
    <text class="gloss" x="835" y="142">chat template</text>
    <text class="gloss" x="835" y="162">+ loss mask</text>

    <text class="step" x="1070" y="116">Train</text>
    <text class="gloss" x="1070" y="142">LoRA / QLoRA</text>
    <text class="gloss" x="1070" y="162">or full FT</text>

    <text class="step" x="1305" y="116">Evaluate</text>
    <text class="gloss" x="1305" y="142">target +</text>
    <text class="gloss" x="1305" y="162">regressions</text>

    <text class="step" x="1515" y="116">Deploy</text>
    <text class="gloss" x="1515" y="142">adapter</text>
    <text class="gloss" x="1515" y="162">or merge</text>

    <text class="step" x="365" y="335">Audit the data</text>
    <text class="gloss" x="365" y="362">duplicates · contradictions</text>
    <text class="gloss" x="365" y="382">lengths</text>

    <text class="step" x="835" y="335">Audit the tokens</text>
    <text class="gloss" x="835" y="362">special tokens · truncation</text>
    <text class="gloss" x="835" y="382">labels</text>

    <text class="step" x="1305" y="335">Audit behaviour</text>
    <text class="gloss" x="1305" y="362">held-out tasks · schemas</text>
    <text class="gloss" x="1305" y="382">safety · style</text>

    <text class="note" x="810" y="470">A lower training loss is not evidence that the deployed model improved.</text>
  </g>
</svg>
