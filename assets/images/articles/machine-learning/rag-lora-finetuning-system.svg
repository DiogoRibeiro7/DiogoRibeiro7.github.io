<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
  <title id="title">Where RAG, fine-tuning, LoRA and QLoRA intervene in an LLM system</title>
  <desc id="desc">RAG changes inference-time context through retrieval. Fine-tuning changes model parameters. LoRA and QLoRA are parameter-efficient fine-tuning methods that modify low-rank adapters while keeping most base weights frozen.</desc>
  <style>
    /* This diagram is embedded with an &lt;img&gt; tag, which makes the file an
       isolated document: currentColor cannot inherit the page's text colour and
       falls back to black, which disappears on the dark theme's near-black
       surface. Carry the surface and the ink the site's other figures use
       (assets/viz/house.mplstyle), so the diagram reads in either theme. */
    svg { color: #0b0b0b; }
    .diagram-surface { fill: #f7f9fa; }
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .flow { fill: none; stroke: currentColor; stroke-width: 2; }
    .label { fill: currentColor; text-anchor: middle;
             font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .step { font-size: 22px; font-weight: 600; }
    .gloss { font-size: 15px; }
    .note { font-size: 17px; }
  </style>
  <rect class="diagram-surface" x="0" y="0" width="100%" height="100%"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="currentColor"/>
    </marker>
  </defs>

  <g class="box">
    <rect x="50" y="70" width="285" height="100" rx="12"/>
    <rect x="385" y="70" width="285" height="100" rx="12"/>
    <rect x="720" y="70" width="285" height="100" rx="12"/>
    <rect x="1055" y="70" width="285" height="100" rx="12"/>

    <rect x="385" y="250" width="285" height="100" rx="12"/>
    <rect x="720" y="250" width="285" height="100" rx="12"/>
    <rect x="720" y="400" width="285" height="110" rx="12"/>
  </g>

  <g class="flow">
    <path d="M335 120 H379" marker-end="url(#arrow)"/>
    <path d="M670 120 H714" marker-end="url(#arrow)"/>
    <path d="M1005 120 H1049" marker-end="url(#arrow)"/>
    <path d="M527 250 V178" marker-end="url(#arrow)"/>
    <path d="M862 250 V178" marker-end="url(#arrow)"/>
    <path d="M862 400 V358" marker-end="url(#arrow)"/>
  </g>

  <g class="label">
    <text class="step" x="192" y="112">User query</text>
    <text class="gloss" x="192" y="140">x</text>

    <text class="step" x="527" y="112">Prompt context</text>
    <text class="gloss" x="527" y="140">instructions + retrieved evidence</text>

    <text class="step" x="862" y="112">LLM</text>
    <text class="gloss" x="862" y="140">parameters θ</text>

    <text class="step" x="1197" y="112">Response</text>
    <text class="gloss" x="1197" y="140">y</text>

    <text class="step" x="527" y="292">RAG</text>
    <text class="gloss" x="527" y="320">retriever + external knowledge store</text>

    <text class="step" x="862" y="292">Fine-tuning</text>
    <text class="gloss" x="862" y="320">updates behaviour or knowledge</text>

    <text class="step" x="862" y="442">LoRA / QLoRA</text>
    <text class="gloss" x="862" y="470">low-rank trainable adapters</text>
    <text class="gloss" x="862" y="492">base weights mostly frozen</text>

    <text class="note" x="700" y="570">RAG changes <tspan font-weight="600">what the model sees</tspan>.</text>
    <text class="note" x="700" y="602">Fine-tuning changes <tspan font-weight="600">the model itself</tspan>.</text>
    <text class="note" x="700" y="634">LoRA changes <tspan font-weight="600">how the update is represented</tspan>.</text>
  </g>
</svg>
