<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 500" role="img" aria-labelledby="title desc">
  <title id="title">RAG retrieval and evaluation pipeline</title>
  <desc id="desc">A RAG pipeline from corpus ingestion through chunking, indexing, candidate retrieval, reranking and context construction to generation, with evaluation metrics attached to retrieval and generation stages.</desc>
  <style>
    /* This diagram is embedded with an &lt;img&gt; tag, which makes the file an
       isolated document: currentColor cannot inherit the page's text colour and
       falls back to black, which disappears on the dark theme's near-black
       surface. Carry the surface and the ink the site's other figures use
       (assets/viz/house.mplstyle), so the diagram reads in either theme. */
    svg { color: #0b0b0b; }
    .diagram-surface { fill: #f7f9fa; }
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .flow { fill: none; stroke: currentColor; stroke-width: 2; }
    .label { fill: currentColor; text-anchor: middle;
             font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .step { font-size: 18px; font-weight: 600; }
    .gloss { font-size: 14px; }
    .note { font-size: 17px; font-weight: 600; }
  </style>
  <rect class="diagram-surface" x="0" y="0" width="100%" height="100%"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="currentColor"/>
    </marker>
  </defs>

  <g class="box">
    <rect x="30" y="90" width="200" height="82" rx="12"/>
    <rect x="265" y="90" width="200" height="82" rx="12"/>
    <rect x="500" y="90" width="200" height="82" rx="12"/>
    <rect x="735" y="90" width="200" height="82" rx="12"/>
    <rect x="970" y="90" width="200" height="82" rx="12"/>
    <rect x="1205" y="90" width="200" height="82" rx="12"/>
    <rect x="1440" y="90" width="150" height="82" rx="12"/>

    <rect x="725" y="290" width="220" height="100" rx="12"/>
    <rect x="960" y="290" width="220" height="100" rx="12"/>
    <rect x="1195" y="290" width="220" height="100" rx="12"/>
  </g>

  <g class="flow">
    <path d="M230 131 H259" marker-end="url(#arrow)"/>
    <path d="M465 131 H494" marker-end="url(#arrow)"/>
    <path d="M700 131 H729" marker-end="url(#arrow)"/>
    <path d="M935 131 H964" marker-end="url(#arrow)"/>
    <path d="M1170 131 H1199" marker-end="url(#arrow)"/>
    <path d="M1405 131 H1434" marker-end="url(#arrow)"/>
    <path d="M835 290 V172"/>
    <path d="M1070 290 V172"/>
    <path d="M1305 290 V172"/>
  </g>

  <g class="label">
    <text class="step" x="130" y="126">Documents</text>
    <text class="gloss" x="130" y="150">source corpus</text>

    <text class="step" x="365" y="126">Chunking</text>
    <text class="gloss" x="365" y="150">units of retrieval</text>

    <text class="step" x="600" y="126">Indexing</text>
    <text class="gloss" x="600" y="150">sparse / dense / hybrid</text>

    <text class="step" x="835" y="126">Candidate retrieval</text>
    <text class="gloss" x="835" y="150">high recall</text>

    <text class="step" x="1070" y="126">Reranking</text>
    <text class="gloss" x="1070" y="150">higher precision</text>

    <text class="step" x="1305" y="126">Context building</text>
    <text class="gloss" x="1305" y="150">ordering + budget</text>

    <text class="step" x="1515" y="126">LLM</text>
    <text class="gloss" x="1515" y="150">answer</text>

    <text class="step" x="835" y="325">Retrieval metrics</text>
    <text class="gloss" x="835" y="352">Recall@k · MRR</text>
    <text class="gloss" x="835" y="372">nDCG</text>

    <text class="step" x="1070" y="325">Context metrics</text>
    <text class="gloss" x="1070" y="352">precision · redundancy</text>
    <text class="gloss" x="1070" y="372">coverage</text>

    <text class="step" x="1305" y="325">Generation metrics</text>
    <text class="gloss" x="1305" y="352">faithfulness · correctness</text>
    <text class="gloss" x="1305" y="372">citation support</text>

    <text class="note" x="810" y="450">A final-answer score cannot tell you which stage failed.</text>
  </g>
</svg>
