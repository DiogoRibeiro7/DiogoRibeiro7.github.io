<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 350" role="img" aria-labelledby="title desc">
  <title id="title">From scientific question to defensible inference</title>
  <desc id="desc">A sequence from scientific question through estimand, target population, design, measurement and analysis to interpretation, followed by replication and revision.</desc>
  <style>
    /* This diagram is embedded with an &lt;img&gt; tag, which makes the file an
       isolated document: currentColor cannot inherit the page's text colour and
       falls back to black, which disappears on the dark theme's near-black
       surface. Carry the surface and the ink the site's other figures use
       (assets/viz/house.mplstyle), so the diagram reads in either theme. */
    svg { color: #0b0b0b; }
    .diagram-surface { fill: #f7f9fa; }
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .flow { fill: none; stroke: currentColor; stroke-width: 2; }
    .label { fill: currentColor; text-anchor: middle;
             font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .step { font-size: 19px; font-weight: 600; }
    .gloss { font-size: 14px; }
    .note { font-size: 16px; font-weight: 600; }
  </style>
  <rect class="diagram-surface" x="0" y="0" width="100%" height="100%"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="currentColor"/>
    </marker>
  </defs>

  <g class="box">
    <rect x="25" y="70" width="190" height="100" rx="12"/>
    <rect x="245" y="70" width="190" height="100" rx="12"/>
    <rect x="465" y="70" width="190" height="100" rx="12"/>
    <rect x="685" y="70" width="190" height="100" rx="12"/>
    <rect x="905" y="70" width="190" height="100" rx="12"/>
    <rect x="1125" y="70" width="190" height="100" rx="12"/>
    <rect x="1345" y="70" width="190" height="100" rx="12"/>
  </g>

  <g class="flow">
    <path d="M215 120 H239" marker-end="url(#arrow)"/>
    <path d="M435 120 H459" marker-end="url(#arrow)"/>
    <path d="M655 120 H679" marker-end="url(#arrow)"/>
    <path d="M875 120 H899" marker-end="url(#arrow)"/>
    <path d="M1095 120 H1119" marker-end="url(#arrow)"/>
    <path d="M1315 120 H1339" marker-end="url(#arrow)"/>
    <path d="M1440 170 C1440 262 900 278 790 182" marker-end="url(#arrow)"/>
  </g>

  <g class="label">
    <text class="step" x="120" y="108">Question</text>
    <text class="gloss" x="120" y="134">What do we</text>
    <text class="gloss" x="120" y="154">want to know?</text>

    <text class="step" x="340" y="108">Estimand</text>
    <text class="gloss" x="340" y="134">What quantity</text>
    <text class="gloss" x="340" y="154">answers it?</text>

    <text class="step" x="560" y="108">Target population</text>
    <text class="gloss" x="560" y="134">For whom,</text>
    <text class="gloss" x="560" y="154">or for what?</text>

    <text class="step" x="780" y="108">Design</text>
    <text class="gloss" x="780" y="134">What comparison</text>
    <text class="gloss" x="780" y="154">identifies it?</text>

    <text class="step" x="1000" y="108">Measurement</text>
    <text class="gloss" x="1000" y="134">What is</text>
    <text class="gloss" x="1000" y="154">actually observed?</text>

    <text class="step" x="1220" y="108">Analysis</text>
    <text class="gloss" x="1220" y="134">How is uncertainty</text>
    <text class="gloss" x="1220" y="154">quantified?</text>

    <text class="step" x="1440" y="108">Interpretation</text>
    <text class="gloss" x="1440" y="134">What does this</text>
    <text class="gloss" x="1440" y="154">support, and what not?</text>

    <text class="note" x="780" y="322">Replication, criticism and revision feed back into design and interpretation</text>
  </g>
</svg>
